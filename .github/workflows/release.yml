name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  RELEASE_REPO: Hypothesis-Studio/Hypothesis-Editor

jobs:
  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:win
        env:
          GH_TOKEN: *** secrets.RELEASE_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:mac
        env:
          GH_TOKEN: *** secrets.RELEASE_PAT }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:linux
        env:
          GH_TOKEN: *** secrets.RELEASE_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest-linux.yml

  publish:
    needs: [release-win, release-mac, release-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: *** secrets.RELEASE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Create tag on release repo
        run: |
          TAG="${{ github.ref_name }}"
          DEFAULT_BRANCH=$(gh api repos/${{ env.RELEASE_REPO }}/default_branch --jq '.')
          HEAD_SHA=$(gh api repos/${{ env.RELEASE_REPO }}/git/refs/heads/${DEFAULT_BRANCH} --jq '.object.sha')

          EXISTING=$(gh api repos/${{ env.RELEASE_REPO }}/git/ref/tags/${TAG} --jq '.object.sha' 2>/dev/null || echo "")
          if [ -z "$EXISTING" ]; then
            gh api repos/${{ env.RELEASE_REPO }}/git/refs \
              --method POST \
              --field ref="refs/tags/${TAG}" \
              --field sha="${HEAD_SHA}"
            echo "Tag ${TAG} created on release repo"
          else
            echo "Tag ${TAG} already exists on release repo (sha: $EXISTING)"
          fi

      - name: Create or update release
        run: |
          TAG="${{ github.ref_name }}"

          # Check if release already exists
          if gh release view "${TAG}" --repo "${{ env.RELEASE_REPO }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on ${{ env.RELEASE_REPO }}, will upload assets"
          else
            echo "Creating release ${TAG} on ${{ env.RELEASE_REPO }}"
            gh release create "${TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --title "Hypothesis ${TAG}" \
              --generate-notes \
              --latest
          fi

      - name: Upload all release assets
        run: |
          TAG="${{ github.ref_name }}"
          UPLOAD_ARGS=""

          # Collect all files to upload
          for f in artifacts/*; do
            [ -f "$f" ] || continue
            UPLOAD_ARGS="$UPLOAD_ARGS $f"
          done

          if [ -z "$UPLOAD_ARGS" ]; then
            echo "No artifacts found to upload"
            exit 1
          fi

          echo "Uploading assets to ${{ env.RELEASE_REPO }} release ${TAG}:"
          echo "$UPLOAD_ARGS" | tr ' ' '\n' | while read f; do [ -f "$f" ] && basename "$f"; done

          # Upload with --clobber to overwrite existing assets (idempotent)
          gh release upload "${TAG}" \
            --repo "${{ env.RELEASE_REPO }}" \
            --clobber \
            $UPLOAD_ARGS

          echo "All assets uploaded successfully"
