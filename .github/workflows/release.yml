name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASE_REPO: Hypothesis-Studio/Hypothesis-Editor

jobs:
  # ── Create release first (once) ──────────────────────────────────
  create-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    outputs:
      release_exists: ${{ steps.create.outputs.release_exists }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract changelog for this version
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="Release ${TAG}"
          fi
          echo "$NOTES" > /tmp/release-notes.md
          echo "Extracted notes for ${VERSION}:"
          cat /tmp/release-notes.md

      - name: Create or update release (no assets yet)
        id: create
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "${TAG}" --repo "${{ env.RELEASE_REPO }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — updating notes"
            gh release edit "${TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --notes-file /tmp/release-notes.md
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Creating release ${TAG}"
            gh release create "${TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --title "Hypothesis ${TAG}" \
              --notes-file /tmp/release-notes.md \
              --draft
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Windows build → upload directly ──────────────────────────────
  release-win:
    needs: create-release
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:win

      - name: List Windows build output
        run: Get-ChildItem release -Recurse | Select-Object Name, Length

      - name: Delete existing Windows assets (avoid duplicates)
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          for asset in $(gh release view "${TAG}" --repo "${{ env.RELEASE_REPO }}" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            case "$asset" in
              Hypothesis\ Setup*.exe*|Hypothesis-*-portable.exe*|Hypothesis-*.zip*|latest.yml)
                echo "Removing $asset"
                gh release delete-asset "${TAG}" "$asset" --repo "${{ env.RELEASE_REPO }}" --yes 2>/dev/null || true
                ;;
            esac
          done

      - name: Upload Windows assets
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          files=()
          # Use find to safely handle spaces in filenames
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find release -maxdepth 1 -type f \( \
            -name 'Hypothesis Setup*.exe' -o \
            -name 'Hypothesis Setup*.exe.blockmap' -o \
            -name 'Hypothesis-*-portable.exe' -o \
            -name 'Hypothesis-*-portable.exe.blockmap' -o \
            -name 'Hypothesis-*.zip' -o \
            -name 'Hypothesis-*.zip.blockmap' -o \
            -name 'latest.yml' \
          \) -print0)
          echo "Uploading ${#files[@]} Windows files..."
          for f in "${files[@]}"; do echo "  $f"; done
          gh release upload "${TAG}" --repo "${{ env.RELEASE_REPO }}" "${files[@]}"

  # ── macOS build → upload directly ────────────────────────────────
  release-mac:
    needs: create-release
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: List macOS build output
        run: ls -lh release/

      - name: Delete existing macOS assets (avoid duplicates)
        run: |
          TAG="${{ github.ref_name }}"
          for asset in $(gh release view "${TAG}" --repo "${{ env.RELEASE_REPO }}" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            case "$asset" in
              Hypothesis-*.dmg*|Hypothesis-*-mac.zip*|latest-mac.yml)
                echo "Removing $asset"
                gh release delete-asset "${TAG}" "$asset" --repo "${{ env.RELEASE_REPO }}" --yes 2>/dev/null || true
                ;;
            esac
          done

      - name: Upload macOS assets
        run: |
          TAG="${{ github.ref_name }}"
          files=()
          for f in release/Hypothesis-*.dmg release/Hypothesis-*.dmg.blockmap release/Hypothesis-*-mac.zip release/Hypothesis-*-mac.zip.blockmap release/latest-mac.yml; do
            [ -f "$f" ] && files+=("$f")
          done
          echo "Uploading ${#files[@]} macOS files..."
          gh release upload "${TAG}" --repo "${{ env.RELEASE_REPO }}" "${files[@]}"

  # ── Linux build → upload directly ────────────────────────────────
  release-linux:
    needs: create-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:linux

      - name: List Linux build output
        run: ls -lh release/

      - name: Delete existing Linux assets (avoid duplicates)
        run: |
          TAG="${{ github.ref_name }}"
          for asset in $(gh release view "${TAG}" --repo "${{ env.RELEASE_REPO }}" --json assets --jq '.assets[].name' 2>/dev/null || true); do
            case "$asset" in
              Hypothesis-*.AppImage*|hypothesis_*.deb*|hypothesis-*.rpm*|latest-linux.yml)
                echo "Removing $asset"
                gh release delete-asset "${TAG}" "$asset" --repo "${{ env.RELEASE_REPO }}" --yes 2>/dev/null || true
                ;;
            esac
          done

      - name: Upload Linux assets
        run: |
          TAG="${{ github.ref_name }}"
          files=()
          for f in release/Hypothesis-*.AppImage release/Hypothesis-*.AppImage.blockmap release/hypothesis_*.deb release/hypothesis-*.rpm release/latest-linux.yml; do
            [ -f "$f" ] && files+=("$f")
          done
          echo "Uploading ${#files[@]} Linux files..."
          for f in "${files[@]}"; do echo "  $f"; done
          gh release upload "${TAG}" --repo "${{ env.RELEASE_REPO }}" "${files[@]}"

  # ── Publish: undraft + add CHANGELOG ─────────────────────────────
  publish:
    needs: [release-win, release-mac, release-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - name: Upload CHANGELOG.md
        run: |
          TAG="${{ github.ref_name }}"
          # Remove old CHANGELOG asset if exists
          gh release delete-asset "${TAG}" "CHANGELOG.md" --repo "${{ env.RELEASE_REPO }}" --yes 2>/dev/null || true
          gh release upload "${TAG}" --repo "${{ env.RELEASE_REPO }}" CHANGELOG.md

      - name: Publish release (undraft)
        run: |
          TAG="${{ github.ref_name }}"
          gh release edit "${TAG}" --repo "${{ env.RELEASE_REPO }}" --draft=false
          echo "Release ${TAG} published to ${{ env.RELEASE_REPO }}"
