name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
  RELEASE_REPO: Hypothesis-Studio/Hypothesis-Editor

jobs:
  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:win
        env:
          GH_TOKEN: *** secrets.RELEASE_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:mac
        env:
          GH_TOKEN: *** secrets.RELEASE_PAT }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml

  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run package:linux
        env:
          GH_TOKEN: *** secrets.RELEASE_PAT }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.blockmap
            release/latest-linux.yml

  publish:
    needs: [release-win, release-mac, release-linux]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: *** secrets.RELEASE_PAT }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: find artifacts -type f | sort

      - name: Collect assets
        id: collect
        run: |
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No artifacts found to upload"
            exit 1
          fi

          echo "Found ${#files[@]} assets:"
          for f in "${files[@]}"; do
            echo "  $(basename "$f")"
          done

      - name: Create or update release and upload assets
        run: |
          TAG="${{ github.ref_name }}"

          # Collect files into array
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find artifacts -type f -print0)

          # Check if release already exists
          if gh release view "${TAG}" --repo "${{ env.RELEASE_REPO }}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists on ${{ env.RELEASE_REPO }}"

            # Update release notes
            gh release edit "${TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --generate-notes
            echo "Release notes updated"

            # Upload assets (clobber overwrites existing)
            echo "Uploading ${#files[@]} assets..."
            gh release upload "${TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --clobber \
              "${files[@]}"
          else
            echo "Creating release ${TAG} on ${{ env.RELEASE_REPO }}"
            gh release create "${TAG}" \
              --repo "${{ env.RELEASE_REPO }}" \
              --title "Hypothesis ${TAG}" \
              --generate-notes \
              "${files[@]}"
          fi

          echo "Release ${TAG} published to ${{ env.RELEASE_REPO }} with ${#files[@]} assets"
